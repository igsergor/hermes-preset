name: build-preset

on:
  schedule:
    - cron: "0 4 1 * *"     # первое число каждого месяца
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Дата сборки
        id: date
        run: echo "value=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-preset:latest
            ghcr.io/${{ github.repository_owner }}/hermes-preset:${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max